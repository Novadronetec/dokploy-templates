services:
  wordpress:
    image: ghcr.io/novadronetec/litespeed-wordpress:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      WP_HOME: ${WP_HOME}
      WP_ENV: ${WP_ENV:-production}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/vhosts/localhost/html
      - ols_logs:/usr/local/lsws/logs
    networks:
      - dokploy-network
      - internal
    depends_on:
      wp-db:
        condition: service_healthy

  wp-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - internal

volumes:
  wp_data:
  ols_logs:
  db_data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
